name: 종가 업데이트

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
    # GitHub 예약 실행은 가끔 늦거나 건너뛰므로 다음 날 새벽(UTC)에 몇 번 더 돌린다. 이미 받은 날은 덮어써도 값이 같다.
    - cron: "17 1 * * 2-6"
    - cron: "47 2 * * 2-6"
    - cron: "17 5 * * 2-6"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 패키지 설치
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: 종가 받아서 Firestore에 저장
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node update-prices.mjs
      - name: 큰수 때문에 못 산 매수 알림
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node big-miss-alert.mjs
