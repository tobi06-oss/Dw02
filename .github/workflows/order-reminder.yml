name: 주문 알림

on:
  # 보류 중 (2026-11-09): GitHub 예약 실행이 하루 두 번(한국시간 19시·새벽 3시쯤)만 돌아 제시간에 못 보내서 끔.
  # 공개 저장소라 실행 기록에 사용자별 계좌 내용이 찍히는 문제도 있어, 다시 켤 때는 로그를 개수만 남기게 고친 뒤 켤 것.
  # schedule:
  #   - cron: "0,30 3-14 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "주문 여부와 상관없이 테스트 알림 보내기"
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 패키지 설치
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: 주문 안 넣은 계좌 확인 후 알림
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: node order-reminder.mjs
